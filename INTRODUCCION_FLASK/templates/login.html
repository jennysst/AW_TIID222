<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contenedor{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(170, 106, 117, 0.158);
            padding: 5%;
            border-radius: 10%;
            border: solid rgb(170, 106, 117);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>INICIO DE SESIÓN</h1>
        <form action="/login" method="POST">
            <label>Correo</label>
            <input type="email" name="correo" class="input input-secondary" required>
            <br><br>
            <label >Contraseña</label>
            <input type="password" name="password" class="input input-secondary" required>
            <br><br>
            <button class="btn btn-outline btn-secondary" type="submit">Entrar</button>
        </form>
        <p>¿No tienes cuenta?</p>
        <a class="link link-secondary" href="{{ url_for('registro') }}">Registrarse</a>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contenedor{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(170, 106, 117, 0.158);
            padding: 3%;
            border-radius: 10%;
            border: solid rgb(170, 106, 117);
        }
        .boton{
            margin-top: 10%;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1 class="text-3xl font-bold">Registro</h1>
        <form action="/registro" method="POST">
            <label>Nombre(s): </label>
            <input type="text" name="nombre" class="input input-secondary" required>
                <br><br>
            <label>Apellido Paterno: </label>
            <input type="text" name="apellido_p" class="input input-secondary" required>
                <br><br>
            <label>Apellido Materno: </label>
            <input type="text" name="apellido_m" class="input input-secondary" required>
                <br><br>
            <label>Correo: </label>
            <input type="text" name="correo" class="input input-secondary" required>
                <br><br>
            <label>Contraseña: </label>
            <input type="text" name="password" class="input input-secondary" required>
                <br><br>
            <label for = "id_rol"> Tipo de usuario </label>
            <select name="id_rol" id="id_rol" class="select select-secondary">
                <option value="1">Administrador</option>
                <option value="2">Usuario</option>
            </select>
            <div class="boton">
                <button class="btn btn-outline btn-secondary" type="submit">Registrarse</button>
            </div>
            
        </form>
        <a class="link link-secondary" href="{{ url_for('login')}}">Regresar</a>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>

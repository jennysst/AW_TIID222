<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Auto</title>
</head>
<body>
    <h1>Autos a eliminar</h1>
    <form action="/eliminar/{{Auto.0}}" method = "POST">
        <input type="text" name="txtMarca" value="{{Auto.1}}" >
        <input type="text" name="txtModelo" value="{{Auto.2}}" >
        <input type="number" name="txtAnio" value="{{Auto.3}}" >
        <button type="submit" onclick="return Eliminar()">Eliminar</button>
        <button type="submit" onclick="Regresar()">Eliminar</button>
    </form>

    <script>
        function Eliminar(){
            return confirm("¿Estas seguro de que deseas eliminar este auto?");
        }
        function Regresar(){
            window.location.href = "{{ url_for('index') }}";
        }
    </script>
</body>
</html>

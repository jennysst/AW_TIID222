<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Autos</title>
</head>
<body>
    <h1>Autos a editar</h1>
    <form action="/actualizar/{{Auto.0}}" method = "POST">
        <input type="text" name="txtMarca" value="{{Auto.1}}" >
        <input type="text" name="txtModelo" value="{{Auto.2}}" >
        <input type="number" name="txtAnio" value="{{Auto.3}}" >
        <button type="submit">Actualizar</button>
    </form>
</body>
</html>
